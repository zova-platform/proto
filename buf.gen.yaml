# Plugins run through `go tool`, so their versions are pinned in go.mod.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/zova-platform/proto/gen/go
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: gen/go
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-go-grpc"]
    out: gen/go
    opt: paths=source_relative
